<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Myanmar Restaurant - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f9f9f9; }
        h1 { color: #b8860b; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        th { background-color: #b8860b; color: white; }
        button { padding: 6px 12px; cursor: pointer; border: none; border-radius: 4px; }
        .btn-delete { background-color: #ff4d4d; color: white; }
        .btn-edit { background-color: #4CAF50; color: white; margin-right: 5px; }
    </style>
</head>
<body>

    <h1>Admin Dashboard</h1>
    
    <div style="text-align: right; margin-bottom: 10px;">
        <!-- <a href="index.html" style="text-decoration: none; background: #333; color: white; padding: 8px 15px; border-radius: 4px;">User Portal သို့ ပြန်ရန်</a> -->
    </div>

    <table>
        <thead>
            <tr>
                <th>စဉ်</th>
                <th>အမည်</th>
                <th>ဖုန်းနံပါတ်</th>
                <th>အီးမေးလ်</th>
                <th>ရက်စွဲ</th>
                <th>ဧည့်သည်ဦးရေ</th>
                <th>စားပွဲအမျိုးအစား</th>
                <th>အထူးမှာကြားချက်</th>
                <th>လုပ်ဆောင်ချက်</th>
            </tr>
        </thead>
        <tbody id="reservation-table-body">
            <!-- JavaScript ဖြင့် ဒေတာများ ဝင်ရောက်လာမည် -->
        </tbody>
    </table>

    <script src="admin.js"></script>
</body>
</html>
