<!DOCTYPE html>
<picture>
  <!-- ပထမဦးစွာ အကောင်းဆုံးနှင့် အသေးငယ်ဆုံး AVIF ကို စစ်ဆေးတင်ပြသည် -->
  <source srcset="image.avif" type="image/avif">
  
  <!-- ဒုတိယအနေဖြင့် WebP ကို စစ်ဆေးတင်ပြသည် -->
  <source srcset="image.webp" type="image/webp">
  
  <!-- ဘရောက်ဆာအဟောင်းများအတွက် မူလ JPEG ပုံကို ပုံမှန်ပြသသည် -->
  <img src="image.jpg" alt="Optimized Image Example" loading="lazy">
</picture>
